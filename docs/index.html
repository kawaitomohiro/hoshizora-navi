<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ほしぞらナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://unpkg.com/three@0.149.0/build/three.min.js"><\/script>');</script>
<style>
:root{
  --bg:#050b1e; --panel:rgba(14,24,56,.94); --panel2:#17275a; --line:rgba(150,180,255,.22);
  --text:#f2f5ff; --sub:#aebde6; --gold:#ffd54a; --pink:#ff9fc4; --green:#7be3a5; --blue:#7fb8ff; --red:#ff7a6b;
  --r:18px; --navh:calc(80px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Hiragino Sans",sans-serif;font-weight:500;
  -webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:0}
#stage{position:fixed;inset:0;z-index:1}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:auto;padding:4px 8px;border-radius:10px;
  font-size:14px;line-height:1.2;text-shadow:0 1px 3px #000,0 0 8px #000;will-change:transform}
.lbl.con{color:#9fc6ff;font-size:15px;font-weight:700;letter-spacing:.05em}
.lbl.con.feat{color:#bcd8ff}
.lbl.con.minor{color:rgba(160,180,230,.6);font-size:13px;font-weight:500;pointer-events:none}
.lbl.star{color:#fff;font-size:13px}
.lbl.ast{color:var(--pink);font-size:13px;font-weight:700}
.lbl.planet{color:#ffe08a;font-size:15px;font-weight:700}
.lbl.moon{color:#fff6c9;font-size:15px;font-weight:700}
.lbl.sun{color:#ffb35a;font-size:15px;font-weight:700}
.lbl.dir{color:#fff;font-size:20px;font-weight:900;background:rgba(0,0,0,.25);pointer-events:none;padding:2px 10px}
.lbl.dir.main{color:var(--gold);font-size:24px}
.lbl.below{opacity:.35}
.lbl.hit{color:var(--gold)!important;font-size:17px}
#ring{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:3;pointer-events:none;display:none}
#ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 18px var(--gold);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{scale:1;opacity:1}50%{scale:1.25;opacity:.6}}
#arrow{position:fixed;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;z-index:3;pointer-events:none;display:none}
#arrow svg{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(0,0,0,.8))}
#cross{position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:2;pointer-events:none;display:none;opacity:.8}
/* 上の帯 */
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;pointer-events:none}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(10,18,44,.78);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px;font-size:15px;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:44px}
.chip svg{width:18px;height:18px;flex:none}
#timeChip{flex:1;justify-content:center;min-width:0}
#timeChip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{white-space:nowrap;flex:none;font-size:13px;background:var(--green);color:#063;border-radius:999px;padding:2px 8px;font-weight:900}
.badge.off{background:var(--gold);color:#530}
#hud{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);z-index:4;pointer-events:none;
  font-size:14px;color:var(--sub);background:rgba(0,0,0,.35);padding:4px 12px;border-radius:999px;white-space:nowrap}
#hud b{color:#fff;font-size:16px}
#targetChip{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 98px);transform:translateX(-50%);z-index:5;display:none;
  background:rgba(60,40,0,.85);border:2px solid var(--gold);border-radius:999px;padding:6px 6px 6px 16px;font-weight:700;align-items:center;gap:8px;white-space:nowrap}
#targetChip .x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);font-size:18px}
#hint{position:fixed;left:50%;bottom:calc(var(--navh) + 18px);transform:translateX(-50%);z-index:4;pointer-events:none;
  background:rgba(0,0,0,.6);border-radius:14px;padding:8px 16px;font-size:18px;font-weight:700;display:none;white-space:nowrap}
#dayBanner{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 146px);z-index:4;display:none;
  background:rgba(255,200,80,.94);color:#3a2500;border-radius:14px;padding:10px 12px;font-size:15px;font-weight:700;
  align-items:center;gap:10px;max-width:560px;margin:0 auto}
#dayBanner button{background:#3a2500;color:#ffe9a8;border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap}
/* 下のボタン */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:12;height:var(--navh);display:flex;justify-content:center;gap:4px;
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:rgba(5,10,28,.96);border-top:1px solid var(--line)}
#nav button{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;
  font-size:13px;font-weight:700;color:#dfe7ff;min-height:62px}
#nav button svg{width:28px;height:28px}
#nav button.on{background:rgba(255,213,74,.18);color:var(--gold)}
#nav button:active{transform:scale(.94)}
/* シート */
.sheet{position:fixed;left:0;right:0;bottom:var(--navh);z-index:10;background:var(--panel);border-top:1px solid var(--line);
  border-radius:24px 24px 0 0;padding:14px 16px 16px;max-height:calc(100% - var(--navh) - 70px);overflow:auto;
  transform:translateY(calc(100% + var(--navh) + 10px));transition:transform .28s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;-webkit-user-select:text;user-select:text;
  max-width:760px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.open{transform:translateY(0)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sheet h2{margin:0 0 4px;font-size:26px;font-weight:900;display:flex;align-items:center;gap:10px}
.sheet .yomi{color:var(--sub);font-size:14px;margin-bottom:8px}
.sheet p{font-size:17px;line-height:1.75;margin:8px 0}
.sheet .close{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{font-size:14px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.tag i{width:12px;height:12px;border-radius:50%;display:inline-block}
.now{background:rgba(123,227,165,.12);border:1px solid rgba(123,227,165,.4);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.6;margin:10px 0}
.now.no{background:rgba(255,255,255,.06);border-color:var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;min-height:48px;flex:1;min-width:140px}
.btn.main{background:var(--gold);color:#3a2500;border-color:transparent}
.btn.pink{background:var(--pink);color:#4a0a25;border-color:transparent}
.btn:active{transform:scale(.97)}
.warn{background:rgba(255,90,70,.18);border:2px solid var(--red);border-radius:14px;padding:10px 12px;font-weight:700;font-size:16px;line-height:1.6}
/* さがす */
.search{display:flex;gap:8px;margin:4px 0 10px}
.search input{flex:1;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#0b1430;color:#fff;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px;margin-bottom:8px}
.tabs button{white-space:nowrap;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:700;font-size:15px}
.tabs button.on{background:var(--gold);color:#3a2500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;min-height:84px;position:relative}
.card b{display:block;font-size:17px;font-weight:900;margin-bottom:2px;padding-right:22px}
.card small{color:var(--sub);font-size:14px}
.card .vis{position:absolute;right:8px;bottom:8px;font-size:13px;font-weight:900;background:var(--green);color:#063;border-radius:999px;padding:2px 7px}
.card .stp{position:absolute;right:8px;top:8px;width:26px;height:26px}
.onlyVis{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:0 0 10px}
.onlyVis input{width:24px;height:24px}
/* スタンプ */
.grid.st{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.stamp{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;min-height:0}
.stamp .seal{width:58px;height:58px;border-radius:50%;border:3px dashed rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.stamp.got .seal{border:3px solid var(--pink);background:radial-gradient(circle,#ff9fc4 0,#e2577f 70%);box-shadow:0 0 14px rgba(255,120,170,.6);transform:rotate(-12deg)}
.stamp .seal svg{width:34px;height:34px}
.stamp b{font-size:14px}
.stamp small{font-size:13px}
.prog{height:14px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 14px}
.prog div{height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:7px}
/* じかん */
.bigtime{font-size:30px;font-weight:900;text-align:center;margin:4px 0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.step{background:var(--panel2);border-radius:14px;padding:6px;text-align:center;border:1px solid var(--line)}
.step div{font-size:15px;color:var(--sub)}
.step .row{display:flex;gap:4px;margin-top:4px}
.step button{flex:1;height:46px;border-radius:10px;background:rgba(255,255,255,.1);font-size:22px;font-weight:900}
input[type=range]{width:100%;height:44px;accent-color:var(--gold)}
.seasons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seasons .btn{min-width:0;padding:10px 4px}
/* 月 */
#moonCanvas3d{width:100%;height:240px;border-radius:16px;background:#02040c;display:block;touch-action:none}
.moonRow{display:flex;gap:14px;align-items:center;margin:8px 0}
.moonRow canvas{width:110px;height:110px;flex:none}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;margin-top:8px}
.strip button{background:var(--panel2);border-radius:12px;padding:6px 2px;font-size:14px;border:1px solid var(--line)}
.strip button.today{border:2px solid var(--gold)}
.strip canvas{width:36px;height:36px;display:block;margin:0 auto 2px}
/* クイズ */
#quizBox{position:fixed;left:0;right:0;bottom:var(--navh);z-index:9;background:var(--panel);border-radius:24px 24px 0 0;padding:14px 16px 14px;
  max-width:760px;margin:0 auto;display:none;border-top:1px solid var(--line)}
#quizBox .q{font-size:20px;font-weight:900;line-height:1.5;margin:4px 0 10px}
#quizBox .qn{color:var(--sub);font-size:14px;display:flex;justify-content:space-between}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices button{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-size:18px;font-weight:700;min-height:56px}
.choices button.ok{background:#1d6b45;border-color:var(--green)}
.choices button.ng{background:#6b2525;border-color:var(--red)}
.exp{font-size:16px;line-height:1.6;margin:10px 0 0}
/* 設定 */
.set{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.set > div{font-size:14px;color:var(--sub);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:12px 8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.seg button.on{background:var(--gold);color:#3a2500}
.small{font-size:15px;color:var(--sub);line-height:1.7}
/* はじめ・おしらせ */
#start{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 50% 30%,#1b2e6b 0,#050b1e 70%)}
#start .box{max-width:460px;width:100%;text-align:center}
#start h1{font-size:44px;font-weight:900;margin:0 0 6px;letter-spacing:.06em;
  background:linear-gradient(90deg,#fff 0,#ffd54a 60%,#ff9fc4);-webkit-background-clip:text;background-clip:text;color:transparent}
#start p{color:var(--sub);font-size:17px;line-height:1.7;margin:0 0 22px}
#start .btn{display:block;width:100%;margin:10px 0;font-size:19px;padding:16px}
#start .stars{font-size:13px;color:var(--sub);margin-top:16px}
#loading{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:18px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%) scale(.9);z-index:50;background:rgba(10,18,44,.96);border:2px solid var(--gold);
  border-radius:20px;padding:18px 22px;font-size:18px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:min(440px,90vw);line-height:1.6}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#dialog{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
#dialog .box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:420px;width:100%;text-align:center}
#dialog .box p{font-size:18px;line-height:1.7;margin:0 0 14px}
#found{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:8;display:none;background:var(--gold);color:#3a2500;
  font-size:26px;font-weight:900;padding:14px 26px;border-radius:999px;box-shadow:0 0 30px rgba(255,213,74,.7);animation:pop .4s}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(-50%,-50%) scale(1)}}
#nudge{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:5;display:none;flex-direction:column;gap:8px;align-items:center;
  background:rgba(0,0,0,.45);border-radius:16px;padding:8px;font-size:14px;color:var(--sub);text-align:center}
#nudge button{width:52px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);font-size:16px;font-weight:900;color:#fff}
#nudge .r0{font-size:13px}
#nudge b{color:#fff;font-size:15px}
#sensorBar{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:5;display:none;flex-direction:column;gap:8px}
#sensorBar button{width:56px;height:56px;border-radius:16px;background:rgba(0,0,0,.5);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;font-weight:700}
#sensorBar button.on{background:var(--gold);color:#3a2500}
#sensorBar svg{width:26px;height:26px}
@media (max-height:520px){ #nudge{flex-direction:row;flex-wrap:wrap;width:132px;justify-content:center} #nudge span{width:100%} #nudge button{width:52px;height:40px} }
/* 横向きで背の低い画面（スマホを横にしたとき）：ボタンは右の列、説明は右から出す */
@media (orientation:landscape) and (max-height:560px){
  :root{--navh:0px;--navw:calc(74px + env(safe-area-inset-right))}
  #nav{top:0;bottom:0;left:auto;right:0;width:var(--navw);height:auto;flex-direction:column;justify-content:center;gap:2px;
    padding:calc(env(safe-area-inset-top) + 4px) calc(env(safe-area-inset-right) + 4px) calc(env(safe-area-inset-bottom) + 4px) 4px;border-top:0;border-left:1px solid var(--line)}
  #nav button{flex:1;max-width:none;min-height:0;max-height:60px;padding:3px 2px;font-size:12px;gap:1px}
  #nav button svg{width:24px;height:24px}
  #top{right:var(--navw);padding:calc(env(safe-area-inset-top) + 6px) 10px 4px calc(env(safe-area-inset-left) + 10px)}
  .chip{min-height:40px;padding:6px 12px;font-size:14px}
  #hud{top:auto;bottom:calc(env(safe-area-inset-bottom) + 8px);left:calc(env(safe-area-inset-left) + 10px);transform:none;font-size:13px}
  #targetChip{top:calc(env(safe-area-inset-top) + 54px);left:calc((100% - var(--navw)) / 2)}
  #dayBanner{top:calc(env(safe-area-inset-top) + 100px);left:calc(env(safe-area-inset-left) + 12px);right:calc(var(--navw) + 12px);margin:0;max-width:520px;padding:8px 10px;font-size:14px}
  .sheet{left:auto;right:var(--navw);top:calc(env(safe-area-inset-top) + 52px);bottom:0;width:min(440px,56vw);max-height:none;margin:0;border-radius:22px 0 0 22px;border-top:0;border-left:1px solid var(--line);
    padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);transform:translateX(calc(100% + var(--navw) + 10px))}
  .sheet.open{transform:translateX(0)}
  .sheet .grab{display:none}
  .sheet h2{font-size:22px;padding-right:48px}
  #quizBox{left:auto;right:var(--navw);bottom:0;width:min(440px,56vw);max-height:100%;overflow:auto;margin:0;border-radius:22px 0 0 0}
  #quizBox .q{font-size:18px}
  .choices button{min-height:48px;padding:10px 6px;font-size:16px}
  #hint{bottom:calc(env(safe-area-inset-bottom) + 44px);left:calc((100% - var(--navw)) / 2)}
  #toast,#found{left:calc((100% - var(--navw)) / 2)}
  #cross{left:calc((100% - var(--navw)) / 2)}
  body.cam #cross{left:50%}
  #nudge{right:calc(var(--navw) + 8px)}
  #sensorBar{left:calc(env(safe-area-inset-left) + 10px)}
  #moonCanvas3d{height:200px}
  #start .box{max-width:560px}
  #start h1{font-size:34px}
  #start p{margin-bottom:12px}
  #start .btn{padding:12px;margin:8px 0}
}
@media (max-width:520px){ #viewChip span{display:none} }
@media (max-width:420px){ #top{gap:6px;padding-left:8px;padding-right:8px} .chip{padding:8px 10px} #liveBadge.off:not(.play){display:none} #timeChip.off{border-color:var(--gold);color:var(--gold)} }
@media (min-width:900px){ .lbl{font-size:15px} .lbl.con{font-size:17px} }
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><div>じゅんびしています…</div></div>
<video id="video" playsinline muted autoplay></video>
<div id="stage"></div>
<div id="labels"></div>
<div id="ring"></div>
<div id="arrow"><svg viewBox="0 0 70 70"><path d="M35 6 L62 50 L44 44 L44 64 L26 64 L26 44 L8 50 Z" fill="#ffd54a" stroke="#3a2500" stroke-width="3" stroke-linejoin="round"/></svg></div>
<svg id="cross" viewBox="0 0 34 34"><circle cx="17" cy="17" r="13" fill="none" stroke="#fff" stroke-width="2"/><path d="M17 0v9M17 25v9M0 17h9M25 17h9" stroke="#fff" stroke-width="2"/></svg>

<div id="top">

  const box = $('#quizBox');
  box.innerHTML = `<div class="qn"><span>${z.i + 1} / ${z.qs.length} もん</span><button id="qEnd" style="color:var(--sub);font-weight:700">やめる</button></div><div class="q">${esc(q.q)}</div><div class="choices">${q.ch.map(c => `<button>${esc(c)}</button>`).join('')}</div><div id="qExp"></div>`;
  box.querySelectorAll('.choices button').forEach(b => b.onclick = () => answer(b));
  $('#qEnd').onclick = endQuiz;
}
function answer(b) {
  const z = S.quiz, q = z.qs[z.i]; if (z.answered) return; z.answered = true;
  const ok = b.textContent === q.ans; if (ok) z.score++;
  $('#quizBox').querySelectorAll('.choices button').forEach(x => { if (x.textContent === q.ans) x.classList.add('ok'); else if (x === b) x.classList.add('ng'); });
  if (q.show) { const p = OBJ[q.show].pos(), a = ASTRO.altAz(p.ra, p.dec, S.time, S.lat, S.lon); flyTo(a.az, a.alt, 60); ringAt = eq(p.ra, p.dec, R); }
  S.quizReveal = q.type === 'shape' ? q.con : null;
  $('#qExp').innerHTML = `<p class="exp"><b style="color:${ok ? 'var(--green)' : 'var(--gold)'}">${ok ? 'せいかい！' : 'こたえは「' + esc(q.ans) + '」'}</b> ${esc(q.exp)}</p><div class="btns"><button class="btn main" id="qNext">${z.i + 1 < z.qs.length ? 'つぎへ' : 'けっかを見る'}</button></div>`;
  $('#qNext').onclick = () => { ringAt = null; S.quizReveal = null; z.i++; if (z.i < z.qs.length) showQ(); else showResult(); };
}
function showResult() {
  const z = S.quiz; S.quizCon = null;
  const msg = z.score >= 9 ? '星のはかせだね！' : z.score >= 6 ? 'よく知っているね！' : z.score >= 3 ? '星となかよくなってきたね。' : 'これから星を見るのが楽しみだね。';
  $('#quizBox').innerHTML = `<div class="q" style="text-align:center;font-size:24px">${z.qs.length}もん中 ${z.score}もん せいかい</div><p style="text-align:center;font-size:18px">${msg}</p><div class="btns"><button class="btn main" id="qAgain">もう一回</button><button class="btn" id="qEnd2">おわる</button></div>`;
  $('#qAgain').onclick = () => { S.quiz = null; startQuiz(); };
  $('#qEnd2').onclick = endQuiz;
}
function endQuiz() {
  const s = S.quiz && S.quiz.saved; S.quiz = null; S.quizCon = null; S.quizReveal = null; ringAt = null;
  $('#quizBox').style.display = 'none'; setNav(null); if (s) flyTo(s.yaw, Math.max(-20, s.pitch), s.fov); updateSky();
}

/* ---------- 下のボタン ---------- */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  const p = b.dataset.p;
  if (S.quiz && p !== 'quiz') endQuiz();
  if (p === 'sensor') { closeSheet(); S.sensor ? stopSensor() : startSensor(); setNav(null); return; }
  if (sheetKind === p) { closeSheet(); return; }
  ({ search: openSearch, time: openTime, moon: openMoon, stamp: openStamps, quiz: () => S.quiz ? endQuiz() : startQuiz() })[p]();
});
$('#placeChip').onclick = openPlace;
$('#timeChip').onclick = openTime;
$('#setChip').onclick = openSettings;
$('#viewChip').onclick = () => sheetKind === 'view' ? closeSheet() : openView();
$('#toNight').onclick = () => { const t = new Date(S.time); if (t.getHours() < 12) t.setDate(t.getDate() - 1); t.setHours(20, 0, 0, 0); setTime(t); toast('夜8時の空にしました。'); };

/* ---------- 小さなお知らせ ---------- */
let toastT = null;
function toast(html, ms) { const t = $('#toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2200); }
function ask(html, btns) {
  $('#dlgText').innerHTML = html; const w = $('#dlgBtns'); w.innerHTML = '';
  btns.forEach(([t, fn], i) => { const b = document.createElement('button'); b.className = 'btn' + (i === 0 ? ' main' : ''); b.textContent = t; b.onclick = () => { $('#dialog').style.display = 'none'; if (fn) fn(); }; w.appendChild(b); });
  $('#dialog').style.display = 'flex';
}
function showLoading(t) { const l = $('#loading'); l.innerHTML = '<div class="spin"></div><div>' + t + '</div>'; l.style.display = 'flex'; }
function hideLoading() { $('#loading').style.display = 'none'; }

/* ---------- 毎フレーム ---------- */
const fwd = new THREE.Vector3();
const RAIL = matchMedia('(orientation:landscape) and (max-height:560px)');
let cover = 0; // 右の列と右から出た説明でかくれる幅。空のまん中をその分左へずらす
function coverTarget() { if (!RAIL.matches || S.cam) return 0; let c = $('#nav').offsetWidth; if (S.quiz) c += $('#quizBox').offsetWidth; return c; }
// 横向きで説明を右から出したとき、その星が説明の下にかくれるなら、見える所まで向きを回す
function keepVisible(id) {
  if (!RAIL.matches || S.sensor || S.quiz) return;
  const o = OBJ[id]; if (!o || !o.pos) return; const p = o.pos(); if (!p) return;
  const sp = screenOf(eq(p.ra, p.dec, R).applyMatrix4(sky.matrix)); if (!sp) return;
  const left = innerWidth - $('#nav').offsetWidth - sheet.offsetWidth;
  if (sp.x > left - 50) flyTo(S.yaw + (sp.x - left / 2) * S.fov / innerHeight, S.pitch);
}
let lastT = performance.now(), lastSky = 0, foundShown = false;
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); if (S.cam) camFov(); }
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 300)); // iPadは回した直後の大きさが遅れて変わる
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (S.play) { S.time = new Date(S.time.getTime() + S.play * 60000 * dt); updateSky(); if (sheetKind === 'time') showBT(); }
  else if (S.live && now - lastSky > 1000) { S.time = new Date(); updateSky(); lastSky = now; }
  stepFly(now);
  if (S.sensor && ori) camera.quaternion.slerp(sensorQuat(), 0.22);
  else camera.rotation.set(S.pitch * D2R, -S.yaw * D2R, 0);
  const ct = coverTarget(); cover = Math.abs(ct - cover) < 1 ? ct : cover + (ct - cover) * 0.2;
  camera.aspect = (innerWidth + cover) / innerHeight;
  if (cover > 0.5) camera.setViewOffset(innerWidth + cover, innerHeight, cover, 0, innerWidth, innerHeight); else camera.clearViewOffset();
  camera.fov = S.fov; camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  const sc = renderer.getPixelRatio() * Math.pow(70 / S.fov, 0.45) * Math.min(1.25, Math.max(0.85, innerHeight / 800));
  starMat.uniforms.scale.value = sc; planetMat.uniforms.scale.value = sc; window.__milky.uniforms.scale.value = renderer.getPixelRatio() * 70 / S.fov;
  // 線の色
  const hl = S.quiz ? S.quizCon : S.target && OBJ[S.target] && OBJ[S.target].kind === 'con' ? S.target : null;
  for (const id in conMesh) {
    const m = conMesh[id].material, on = id === hl;
    m.color.set(on ? 0xffd54a : 0x6fa8ff); m.opacity = on ? 1 : S.quiz ? 0.35 : 0.75;
    conMesh[id].visible = on || S.lines !== 'none';
  }
  const ha = S.target && OBJ[S.target] && OBJ[S.target].kind === 'ast' ? S.target : null;
  for (const id in astMesh) { astMesh[id].visible = !S.quiz && (S.showAst || id === ha); astMesh[id].material.opacity = id === ha ? 0.95 : 0.45; astMesh[id].material.color.set(id === ha ? 0xffd54a : 0xff8fc0); }
  minorGroup.visible = S.lines === 'all' && !S.quiz;
  const tgtBelow = S.target && OBJ[S.target] && OBJ[S.target].kind !== 'tip' && altAzOf(OBJ[S.target]).alt < 0;
  groundMat.opacity = S.quiz || S.seeThru || tgtBelow ? 0.45 : S.cam ? 0.35 : 0.9;
  // 月の光っている側を太陽へ向ける
  const ms = screenOf(moonSpr.position.clone().applyMatrix4(sky.matrix));
  if (ms) {
    const toward = moonSpr.position.clone().normalize().lerp(sunSpr.position.clone().normalize(), 0.02).multiplyScalar(R).applyMatrix4(sky.matrix);
    const ss = screenOf(toward); if (ss) moonSpr.material.rotation = Math.atan2(-(ss.y - ms.y), ss.x - ms.x);
  }
  renderer.render(scene, camera);
  updateLabels();
  updateHud();
}
function updateLabels() {
  camera.getWorldDirection(fwd);
  const W = innerWidth, H = innerHeight;
  labels.forEach(L => {
    let show = true;
    if (L.minor && S.lines !== 'all') show = false;
    if (L.ast && !S.showAst && L.id !== S.target) show = false;
    if (L.id !== S.target) {
      if (L.cls.startsWith('con') && !S.nameCon) show = false;
      if (L.cls === 'star' && !S.nameStar) show = false;
      if ((L.cls === 'planet' || L.cls === 'moon' || L.cls === 'sun') && !S.namePl) show = false;
    }
    if (L.cls.startsWith('dir') && !S.showDir) show = false;
    if (S.quiz && !L.cls.startsWith('dir') && !(S.quizReveal && L.id === S.quizReveal)) show = false;
    if (L.id === 'sun' && sunAlt < -2 && S.target !== 'sun') show = false;
    let p = null;
    if (show) {
      const v = L.getVec().clone(); if (L.frame === 'sky') v.applyMatrix4(sky.matrix);
      const alt = v.y / v.length();
      if (fwd.dot(v) <= 0) show = false;
      else { p = screenOf(v); if (!p || p.x < -80 || p.x > W + 80 || p.y < -40 || p.y > H + 40) show = false; }
      if (show) L.el.classList.toggle('below', alt < -0.01 && L.frame === 'sky');
    }
    if (!show) { if (L.vis !== false) { L.el.style.display = 'none'; L.vis = false; } return; }
    if (L.vis !== true) { L.el.style.display = ''; L.vis = true; }
    L.el.classList.toggle('hit', !!L.id && (L.id === S.target || L.id === S.quizReveal));
    L.el.style.transform = `translate(${Math.round(p.x)}px,${Math.round(p.y + (L.dy || 0))}px) translate(-50%,-50%)`;
  });
  // 目あての丸と矢印
  const ring = $('#ring'), arrow = $('#arrow'), hint = $('#hint');
  let tv3 = null;
  if (ringAt) tv3 = ringAt.clone().applyMatrix4(sky.matrix);
  else if (S.target && OBJ[S.target] && OBJ[S.target].pos) { const p = OBJ[S.target].pos(); if (p) tv3 = eq(p.ra, p.dec, R).applyMatrix4(sky.matrix); }
  if (!tv3) { ring.style.display = arrow.style.display = hint.style.display = 'none'; $('#found').style.display = 'none'; return; }
  const sp = fwd.dot(tv3.clone().normalize()) > 0 ? screenOf(tv3) : null;
  const rail = RAIL.matches, cx = (W - cover) / 2, cy = rail ? H / 2 : H / 2 - 10;
  const inView = sp && sp.x > 30 && sp.x < W - Math.max(cover, rail ? $('#nav').offsetWidth : 0) - 30 && sp.y > (rail ? 50 : 90) && sp.y < H - (rail ? 40 : 110);
  if (inView) {
    ring.style.display = 'block'; ring.style.transform = `translate(${sp.x}px,${sp.y}px)`; arrow.style.display = 'none';
    const big = S.target && OBJ[S.target] && (OBJ[S.target].kind === 'con' || OBJ[S.target].kind === 'ast'); ring.style.width = ring.style.height = big ? '120px' : '64px'; ring.style.margin = big ? '-60px 0 0 -60px' : '-32px 0 0 -32px';
  } else ring.style.display = 'none';
  if (!inView && S.target && S.targetActive && !S.quiz) {
    const c = tv3.clone().applyMatrix4(camera.matrixWorldInverse); let ang = Math.atan2(c.y, c.x);
    if (c.z > 0 && Math.hypot(c.x, c.y) < 1) ang = Math.PI / 2;
    const rx = (W - cover) / 2 - 50, ry = H / 2 - (rail ? 110 : 130), k = Math.min(rx / Math.abs(Math.cos(ang) || 1e-6), ry / Math.abs(Math.sin(ang) || 1e-6));
    arrow.style.display = 'block';
    arrow.style.transform = `translate(${cx + Math.cos(ang) * k}px,${cy - Math.sin(ang) * k}px) rotate(${90 - ang * R2D}deg)`;
    hint.style.display = 'block';
    const deg = ang * R2D;
    hint.textContent = (deg > 45 && deg < 135 ? 'もっと上' : deg < -45 && deg > -135 ? 'もっと下' : Math.abs(deg) <= 45 ? 'もっと右' : 'もっと左') + 'に、' + OBJ[S.target].name;
  } else { arrow.style.display = 'none'; hint.style.display = 'none'; }
  // かざして見つけた
  if (S.sensor && S.target && S.targetActive && sp && !foundShown && tv3.y > 0 && (sunAlt < -6 || S.target === 'moon')) {
    if (Math.hypot(sp.x - cx, sp.y - H / 2) < Math.min(W, H) * 0.12) {
      foundShown = true; const f = $('#found'); f.style.display = 'block'; if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      setTimeout(() => { f.style.display = 'none'; if (S.target) openInfo(S.target); }, 1500);
    }
  }
}
function updateHud() {
  const az = ASTRO.norm(Math.atan2(fwd.x, -fwd.z) * R2D), alt = Math.asin(Math.max(-1, Math.min(1, fwd.y))) * R2D;
  const t = `<b>${dirName(az)}</b>の空 ・ 高さ${Math.round(alt)}°`;
  if (updateHud.l !== t) { $('#hud').innerHTML = t; updateHud.l = t; }
}

/* ---------- はじめる ---------- */
// はじめの向き：いま見やすい「星のならび」の方へ。なければ南
function aimStart() {
  S.yaw = 180; S.pitch = 35; S.fov = innerWidth < innerHeight ? 80 : 70;
  if (sunAlt > -6) return;
  for (const a of ASTERISMS) { const h = altAzOf(OBJ[a.id]); if (h.alt > 20 && h.alt < 72) { S.yaw = h.az; S.pitch = Math.min(50, h.alt); return; } }
}
function boot() {
  resize(); applySettings();
  const pl = store.get('place', null);
  if (pl) setPlace(pl[0], pl[1], pl[2]); else updateSky();
  hideLoading();
  requestAnimationFrame(frame);
  aimStart();
  if (!pl) {
    $('#start').style.display = 'flex';
    $('#startGps').onclick = () => { $('#start').style.display = 'none'; getGps(false); };
    $('#startTokyo').onclick = () => { $('#start').style.display = 'none'; setPlace('東京', 35.68, 139.69, true); };
  }
  window.__hzn = { S, ASTRO, sky, camera, OBJ, altAzOf, updateSky, openInfo, setTarget, labels, startQuiz };
}
boot();
})();

</script>
